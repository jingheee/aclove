app:
  host: "0.0.0.0"
  port: 8888

database:
  host: "${DB_HOST:localhost}"
  port: "${DB_PORT:5433}"
  username: "${DB_USERNAME:postgres}"
  password: "${DB_PASSWORD:root}"
  name: "${DB_NAME:aclove}"
  sslmode: "${DB_SSLMODE:disable}"
  max_open_conns: 25
  max_idle_conns: 5
  conn_max_lifetime: 300

redis:
  addr: "${REDIS_ADDR:localhost:6379}"
  password: "${REDIS_PASSWORD:}"
  db: 0
  cache_prefix: "aclove:cache:"
  cache_ttl: "24h"
  session_prefix: "aclove:session:"
  session_ttl: "720h"
  session_cleanup_interval: "5m"

session:
  cookie_name: "aclove_session"
  cookie_domain: ""
  cookie_secure: false
  cookie_http_only: true
  cookie_same_site: "Lax"

storage:
  rustfs:
    base_url: "${RUSTFS_BASE_URL:http://localhost:8080}"
    username: "${RUSTFS_USERNAME:rustfsadmin}"
    password: "${RUSTFS_PASSWORD:rustfsadmin}"
    max_file_size: 52428800  # 50MB
    max_concurrent: 10
