app:
  host: "0.0.0.0"
  port: 8888

database:
  host: "${DB_HOST:localhost}"
  port: "${DB_PORT:5433}"
  username: "${DB_USERNAME:postgres}"
  password: "${DB_PASSWORD:root}"
  name: "${DB_NAME:aclove}"
  sslmode: "${DB_SSLMODE:disable}"
  max_open_conns: 25
  max_idle_conns: 5
  conn_max_lifetime: 300

redis:
  addr: "${REDIS_ADDR:localhost:6379}"
  password: "${REDIS_PASSWORD:}"
  db: 0
  cache_prefix: "aclove:cache:"
  cache_ttl: "24h"
  session_prefix: "aclove:session:"
  session_ttl: "720h"
  session_cleanup_interval: "5m"

session:
  cookie_name: "aclove_session"
  cookie_domain: ""
  cookie_secure: false
  cookie_http_only: true
  cookie_same_site: "Lax"

storage:
  minio:
    endpoint: "http://localhost:9000"
    bucket: "aclove"
    access_key_id: "root"      # 默认为 root
    secret_access_key: "root12345"  # 默认为 root
    region: "us-east-1"
    public_url: "http://localhost:9000"
    max_file_size: 52428800
    max_concurrent: 10
